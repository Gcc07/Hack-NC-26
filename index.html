<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meadow — Meet Everyone, Anywhere, Doing Ordinary Wonders</title>
  <meta name="description" content="Student org event planning made easy: shared availability, AI-suggested times, role commitments, and group chat.">
  <meta name="theme-color" content="#2c9bea">
  <link rel="icon" type="image/png" href="Assets/Meadow1.png">
  <!-- Roboto Medium is required by Google's "Sign in with Google" button guidelines. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap">
  <link rel="stylesheet" href="css/aero.css?v=buddy">
  <link rel="stylesheet" href="css/eyey.css?v=dirt">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <!-- Frutiger Aero scenery. These layers live outside #app so the app's full re-renders never restart them. -->
  <div id="fx-sky" aria-hidden="true"></div>
  <div id="fx-sun" aria-hidden="true"></div>
  <div id="fx-meadow" aria-hidden="true">
    <div class="meadow-haze"></div>
    <div class="meadow-field"></div>
    <div id="fx-hills"></div>
  </div>
  <div id="fx-bubbles" aria-hidden="true"></div>

  <div id="connection-status" class="connection-status" role="status" aria-live="polite">Connecting…</div>
  <div id="app"></div>
  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>

  <canvas id="fx-orbs" aria-hidden="true"></canvas>
  <div id="fx-burst" aria-hidden="true"></div>
  <div id="fx-controls" role="group" aria-label="Visual and sound effects">
    <button type="button" id="fx-toggle-visual" class="fx-btn" aria-pressed="true" aria-label="Animated sky and bubbles" title="Animated sky &amp; bubbles">✨</button>
    <button type="button" id="fx-toggle-sound" class="fx-btn" aria-pressed="true" aria-label="Interface sounds" title="Interface sounds">🔊</button>
  </div>

  <noscript>Meadow needs JavaScript to run.</noscript>

  <!-- Vendored locally (see js/vendor/LICENSES.md) so the demo works without internet. -->
  <script src="js/vendor/three.min.js"></script>
  <script src="js/vendor/vanta.clouds.min.js"></script>
  <script src="js/vendor/tsparticles.bundle.min.js"></script>
  <script src="js/vendor/gsap.min.js"></script>
  <script src="js/vendor/howler.min.js"></script>
  <script src="js/vendor/d3.min.js"></script>

  <script src="js/config.js"></script>
  <script src="js/util.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ics.js"></script>
  <script src="js/scheduler.js"></script>
  <script src="js/assistant.js"></script>
  <script src="js/actions.js"></script>
  <script src="js/imessage.js"></script>
  <script src="js/views-shell.js"></script>
  <script src="js/views-chat.js"></script>
  <script src="js/views-events.js"></script>
  <script src="js/views-schedule.js"></script>
  <script src="js/views-insights.js"></script>
  <script src="js/views-people.js"></script>
  <script src="js/app.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/eyey.js"></script>
</body>
</html>
