# nginx reverse proxy for Meadow (gunicorn listens on 127.0.0.1:5000).
#
# Install:
#   sudo cp deploy/nginx-meadow.conf /etc/nginx/sites-available/meadow
#   (replace yourname.tech below with your real domain)
#   sudo ln -s /etc/nginx/sites-available/meadow /etc/nginx/sites-enabled/meadow
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS (after your domain's DNS A record points at this server):
#   sudo apt install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d yourname.tech -d www.yourname.tech
# Certbot edits this file to add the port 443 block and the HTTP->HTTPS redirect.

server {
    listen 80;
    listen [::]:80;
    server_name yourname.tech www.yourname.tech;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Spectrum iMessage bridge (meadow npm start → 127.0.0.1:5055).
    # Browser uses MEADOW_CONFIG.IMESSAGE_BRIDGE_URL = https://your-domain/imessage
    location /imessage/ {
        proxy_pass http://127.0.0.1:5055/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
